[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a13n-cyber"
version = "0.1.0"
description = "General-purpose autonomous security agent built on a13n Harness"
requires-python = ">=3.13"
dependencies = [
    "a13n-harness==0.11.1",
    "openai>=3.5,<4",
    "pydantic-ai>=2.55,<3",
    "tsec-benchmark==0.1.2",
]

[project.scripts]
a13n-cyber = "tsec_agent.cli:main"
tsec-agent = "tsec_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4.1,<5",
    "ruff>=0.17.0",
]
