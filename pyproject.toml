[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsec-step-agent"
version = "0.1.0"
description = "StepFun-backed TSecBench agent workspace and container preparation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tsec-agent = "tsec_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
